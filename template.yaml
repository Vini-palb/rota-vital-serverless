AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  rota-vital-serverless

  Atividade individual 1 (Serverless) - gera a guia de transporte de uma requisição do Rota Vital.

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 10       # Passo 5: trocar para 10, rodar `sam build` e repetir
    MemorySize: 128

Resources:
  HelloWorldFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: hello_world/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Events:
        Guias:
          Type: Api
          Properties:
            Path: /guias
            Method: post

Outputs:
  GuiasApi:
    Description: "URL do endpoint /guias no API Gateway (stage Prod)"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/guias/"
  HelloWorldFunction:
    Description: "ARN da função"
    Value: !GetAtt HelloWorldFunction.Arn
